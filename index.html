<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>MarloDev | Roblox UI Designer</title>
  <meta name="description" content="MarloDev designs Roblox UI: shops, HUDs, menu buttons and lobbies, built in Roblox Studio and scaled for every device." />
  <meta name="theme-color" content="#0B6BFF" />
  <link rel="icon" href="assets/headshot.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@900&family=Geist:wght@400;500;600&family=Geist+Mono:wght@500&display=swap" />
  <link rel="stylesheet" href="css/style.css" />
  <script>
    // Animations only run when the visitor allows motion; otherwise everything renders in its final state.
    if (!matchMedia("(prefers-reduced-motion: reduce)").matches) document.documentElement.classList.add("motion");
  </script>
</head>
<body>
  <header class="nav" data-nav>
    <nav class="nav__pill" aria-label="Main">
      <a class="nav__brand" href="#top" data-bind="name"></a>
      <ul class="nav__links">
        <li><a href="#work">Work</a></li>
        <li><a href="#rates">Rates</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
      <button class="nav__cta" type="button" data-discord>Message me</button>
    </nav>
  </header>

  <main>
    <section class="hero" id="top">
      <div class="hero__field" aria-hidden="true"></div>
      <div class="hero__word-wrap" aria-hidden="true" data-hero-word><p class="hero__word" id="hero-word"></p></div>
      <div class="hero__figure" data-hero-figure><img data-avatar alt="MarloDev's Roblox avatar" /></div>
      <div class="hero__copy">
        <span class="badge" id="availability"><span class="badge__dot"></span>Open for commissions</span>
        <h1 class="hero__title">I design Roblox UI that players love to click.</h1>
        <p class="hero__sub" data-bind="tagline"></p>
        <div class="hero__ctas">
          <button class="pill" type="button" data-discord><span class="pill__label">Message me</span><span class="pill__icon" data-arrow></span></button>
          <a class="text-link" href="#work">See my work</a>
        </div>
      </div>
    </section>

    <div class="marquee" aria-hidden="true"><div class="marquee__track" id="marquee"></div></div>

    <section class="intro" id="about">
      <div class="container">
        <p class="intro__statement" id="intro"></p>
        <div class="bigs" id="stats"></div>
      </div>
    </section>

    <section class="work" id="work">
      <div class="container">
        <h2 class="section-title" data-reveal>My work</h2>
        <div class="bento" id="projects"></div>
      </div>
    </section>

    <section class="rates" id="rates">
      <div class="container">
        <h2 class="section-title" data-reveal>Rates</h2>
        <div class="rates__grid" id="pricing"></div>
        <p class="rates__note" data-bind="pricingNote"></p>
      </div>
    </section>

    <section class="closer" id="contact">
      <div class="hero__field" aria-hidden="true"></div>
      <h2 class="closer__title" data-reveal><span>Let’s</span><span>cook.</span></h2>
      <div class="closer__figure" data-reveal><img data-avatar alt="" loading="lazy" /></div>
      <div class="closer__cta" id="contact-links"></div>
    </section>
  </main>

  <footer class="foot">
    <p class="foot__name"><span data-bind="name"></span> <a data-roblox target="_blank" rel="noopener" data-bind="handle"></a></p>
    <p class="foot__small">Not affiliated with Roblox Corporation.</p>
  </footer>

  <dialog class="modal" id="modal" aria-labelledby="modal-title">
    <button class="modal__close" type="button" aria-label="Close" data-close>&times;</button>
    <div class="modal__shot" id="modal-shot"></div>
    <div class="modal__body">
      <p class="cell__cat" id="modal-cat"></p>
      <h3 class="modal__title" id="modal-title"></h3>
      <p class="modal__desc" id="modal-desc"></p>
      <ul class="chips" id="modal-tags"></ul>
      <a class="text-link text-link--ink" id="modal-link" target="_blank" rel="noopener" hidden>Play the game</a>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="grain" aria-hidden="true"></div>

  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
